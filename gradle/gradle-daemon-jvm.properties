# Run the Gradle daemon on a Java 21 runtime, whichever Java launches Gradle.
# Gradle 8.14.3 (used here, matching AGP 8.13) cannot run on Java 25, which is what recent Android Studio
# versions bundle. Java 21 is found automatically, e.g. the JetBrains Runtime that Android Studio keeps in
# ~/Library/Java/JavaVirtualMachines/jbr-21.*.
toolchainVersion=21
